# What happens after a merge. The gates from `pr.yml` run again on a clean
# machine, and then semantic-release reads the commits since the last tag and
# decides whether this push is a release. Nobody bumps a version or types
# `npm publish` — the commit messages are the release input (see
# `release.config.js`).
name: Release

on:
  push:
    branches: [main]

permissions:
  # semantic-release pushes the `v${version}` tag, @semantic-release/github
  # creates the release that hangs from it, and @semantic-release/git pushes
  # the `chore: release …` commit that carries the bumped package.json and
  # CHANGELOG.md back to main.
  contents: write
  # @semantic-release/github comments on the issues and pull requests a release
  # closes; without these the comment is a 403 and the whole job fails after
  # having already published.
  issues: write
  pull-requests: write
  # The entire npm authentication story: the job mints a short-lived OIDC token
  # and trades it with the registry for publish rights on `mcp-whoop`. The
  # trusted publisher configured on npmjs.com names this file — `release.yml`,
  # case-sensitive, extension included — so renaming it revokes publish rights
  # until the registry side is updated to match.
  #
  # The same token signs the provenance attestation that puts "Built and
  # signed on GitHub Actions" on the npm page. OIDC publishes attest by
  # default; `publishConfig.provenance` in package.json states that intent
  # outright, and its `access: "public"` sits beside it because npm refuses
  # to attest a package it considers new until the access it would default
  # to anyway is stated as well.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Same reason as `pr.yml`: `CI=true` stopped skipping hooks in husky v9.
      # It matters twice here — `prepare` runs on install, and again when
      # `npm publish` packs the tarball.
      HUSKY: 0
    steps:
      # semantic-release pushes the release commit and the tag during
      # `prepare`, before `npm publish` runs — so a publish that cannot
      # authenticate leaves `main` claiming a release the registry never saw.
      # Twice the cleanup has been exactly that. Trusted publishing cannot
      # create a package that has never been published, so until `mcp-whoop`
      # exists on the registry this job cannot succeed; checking first keeps
      # the failure ahead of everything that writes.
      - name: Stop early if the registry has no mcp-whoop
        run: curl --silent --fail --retry 3 https://registry.npmjs.org/mcp-whoop > /dev/null

      - uses: actions/checkout@v7
        with:
          # semantic-release finds the last release from the tags and the next
          # one from the commits since it; a depth-1 checkout has neither.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          # The major that wrote `pnpm-lock.yaml` (lockfileVersion 9.0).
          version: 11

      - uses: actions/setup-node@v7
        with:
          # Matches `pr.yml`: the floor of the `engines.node` range, which is
          # set by lint-staged 17 (`>=22.22.1`) — a stricter bound than
          # semantic-release 25's own `^22.14.0 || >=24.10.0`.
          node-version: 22.22.1
          cache: pnpm

      # `@semantic-release/npm` shells out to whatever `npm` is on PATH, and the
      # one bundled with Node 22.22.1 is 10.9.4 — old enough to publish, but too
      # old to trade this job's OIDC token for publish rights, which needs
      # 11.5.1. Upgrading the CLI rather than the runtime keeps the pin above
      # meaningful: the build still has to work on the oldest Node the package
      # claims to support.
      - name: Use an npm that can publish over OIDC
        run: npm install --global npm@11

      - run: pnpm install --frozen-lockfile

      # A release is a publish, so the gates run before it rather than beside
      # it — a failure here means nothing reaches the registry.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm check

      # `files: ["dist"]` makes the tarball whatever `dist/` holds when npm
      # packs it, and `dist/` is gitignored. No `prepack` hook builds it, so
      # skipping this step would publish an empty package.
      - name: Build
        run: pnpm build

      - name: Release
        env:
          # Reads the repository and writes the GitHub release. The npm half of
          # the job is OIDC and takes no token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
